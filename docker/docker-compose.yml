version: '3.8'

services:
  liventra-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: liventra-cloud-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SUPABASE_URL=https://qtkuqwafpasalsgogpka.supabase.co
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  liventra-nginx:
    image: nginx:alpine
    container_name: liventra-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - liventra-api
