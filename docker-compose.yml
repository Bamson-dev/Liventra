version: '3.8'

services:
  liventra:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liventra-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SUPABASE_URL=https://qtkuqwafpasalsgogpka.supabase.co
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
