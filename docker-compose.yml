version: '3.8'

services:
  liventra:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liventra-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SUPABASE_URL=https://qtkuqwafpasalsgogpka.supabase.co
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
